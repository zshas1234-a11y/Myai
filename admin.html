<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="height:auto">
  <main class="admin">
    <h1>Admin<span class="dot"></span></h1>

    <section id="loginBox" class="card">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="loginBtn" class="btn" type="button">Login</button>
      <p id="loginStatus" class="status"></p>
    </section>

    <section id="panel" class="card" hidden>
      <label>Website links</label>
      <div id="rows"></div>
      <button id="addBtn" class="btn light" type="button">Link add karein</button>
      <button id="saveBtn" class="btn" type="button">Save karein</button>
      <p id="saveStatus" class="status"></p>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
