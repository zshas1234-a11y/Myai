<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyAI - Your AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h2>🤖 MyAI</h2>
    <button id="newChat">+ New Chat</button>
    <div class="side-info">Your personal AI assistant</div>
  </aside>

  <main class="main">
    <header>
      <h3>MyAI Assistant</h3>
      <span class="status">● Online</span>
    </header>

    <section id="chat">
      <div class="welcome">
        <h1>Welcome to MyAI</h1>
        <p>What can I help you with today?</p>
      </div>
    </section>

    <div class="input-area">
      <textarea id="prompt" rows="1"
        placeholder="Message MyAI..."></textarea>
      <button id="send">➤</button>
    </div>
    <p class="footer">MyAI can make mistakes. Verify important information.</p>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
